<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍜 ラーメン推薦アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍜 ラーメン推薦アプリ</h1>
            <p class="subtitle">場所を指定または現在地で評判の良いラーメン屋を探します</p>
        </header>

        <div class="location-section">
            <form id="locationForm" class="location-form">
                <div class="input-group">
                    <input
                        type="text"
                        id="locationInput"
                        class="location-input"
                        placeholder="場所を入力してください（例：東京駅、渋谷区、新宿三丁目）"
                    >
                    <button type="submit" class="btn-primary">
                        🔍 検索
                    </button>
                </div>
            </form>

            <div class="divider">
                <span>または</span>
            </div>

            <button id="getCurrentLocationBtn" class="btn-secondary">
                📍 現在地から検索
            </button>

            <p id="locationStatus" class="status-text"></p>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>ラーメン屋を検索中...</p>
        </div>

        <div id="results" class="results-container hidden">
            <h2>おすすめのラーメン屋</h2>
            <div id="restaurantList" class="restaurant-list"></div>
        </div>

        <div id="error" class="error-message hidden"></div>
    </div>

    <footer>
        <p>場所を入力するか現在地を取得して、近くの評判の良いラーメン屋を検索します</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
